# lxc, Linux Containers

# Get a clean procfs mounted at /dev/.lxc/proc by using nesting.conf.
# The security losses are acceptable, as the apparmor profile of nesting.conf,
# lxc-container-default-with-nesting, is no less secure than lxc's default
# lxc-container-default. Both allow unprivileged user namespaces.
lxc.include = /usr/share/lxc/config/nesting.conf
# We want a profile that is softer than lxc-container-default-with-nesting so
# that we can run nsjail, gVisor, etc.
# An unconfined profile is a good choice, as lxc-container-default-with-nesting
# is essentially unconfined, since it sets change_profile -> unconfined, which
# means any process can simply shed apparmor by itself.
# However, we cannot simply use unconfined here, as Ubuntu's default
# sysctl kernel.apparmor_restrict_unprivileged_userns=1 disables unprivileged
# user namespaces when a process is unconfined.
# Thus, the solution here is to write our own profile that is softer but based
# on lxc-container-default-with-nesting.
lxc.apparmor.profile = lxc-myprofile

lxc.net.0.type = veth
lxc.net.0.link = lxcbr0
lxc.idmap = u 0 100000 65536
lxc.idmap = g 0 100000 65536

# Network tun device for tailscale.
lxc.cgroup2.devices.allow = c 10:200 rw
lxc.mount.entry = /dev/net/tun dev/net/tun none bind,create=file
# KVM for firecracker.
lxc.cgroup2.devices.allow = c 10:232 rw
lxc.mount.entry = /dev/kvm dev/kvm none bind,create=file

# Create, start, and attach to a container with
# 	lxc-create -n $CNAME --template download -- --dist ubuntu --release resolute --arch amd64
# 	lxc-unpriv-start -n $CNAME
# 	lxc-unpriv-attach -n $CNAME
#
# The rootfs for user (non-root) containers is:
# 	lxc.lxcpath = $HOME/.local/share/lxc/<container-name>/rootfs
#
# To copy a container:
# 	sudo rsync -aHAX --numeric-ids ~/.local/share/lxc/$SRC/ ~/.local/share/lxc/$DST/
# 	Manually edit ~/.local/share/lxc/$DST/config to rename references from $SRC to $DST, especially the lxc.rootfs.path and lxc.uts.name fields.
